<figure class="code-block">
  <figcaption class="code-block__bar">
    <span class="code-block__lang">{{label}}</span>
    <button type="button" class="code-block__copy" data-label="Copy" data-done="Copied" aria-label="Copy code">
      <svg class="code-block__icon code-block__icon--copy" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
      </svg>
      <svg class="code-block__icon code-block__icon--check" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 6 9 17l-5-5"></path>
      </svg>
      <span class="code-block__copy-label">Copy</span>
    </button>
  </figcaption>
  <pre class="code-block__pre"><code class="language-{{language}}">{{code}}</code></pre>
</figure>
